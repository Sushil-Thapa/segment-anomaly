[project]
name = "segment-anomaly"
version = "1.0.0"
description = "Production-ready Swin-UNet for wafer defect segmentation"
authors = [
    {name = "Sushil Thapa", email = "xsushil@outlook.com"},
]
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "MIT"}
keywords = ["deep-learning", "segmentation", "computer-vision", "pytorch", "wafer-defects"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Core deep learning framework
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    # Model architectures and pre-trained models
    "timm>=0.9.0",
    # Data processing and augmentation
    "opencv-python>=4.8.0",
    "albumentations>=1.3.0",
    "Pillow>=10.0.0",
    "scikit-image>=0.21.0",
    # Scientific computing
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    # Data handling and analysis
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    # Visualization and plotting
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tensorboard>=2.13.0",
    # Configuration and utilities
    "PyYAML>=6.0",
    "omegaconf>=2.3.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
    # Model export and deployment
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    # System monitoring
    "psutil>=5.9.0",
    "kaggle>=1.7.4.5",
    "kagglehub>=0.3.13",
    "tabulate>=0.9.0",
    # Experiment tracking
    "mlflow>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]
gpu = [
    # apex removed - not compatible with Python 3.12+ on Windows
]
tracking = [
    "wandb>=0.15.0",
]
all = [
    "segment-anomaly[dev,gpu,tracking]",
]

[project.urls]
Homepage = "https://github.com/Sushil-Thapa/segment-anomaly"
Repository = "https://github.com/Sushil-Thapa/segment-anomaly.git"
Issues = "https://github.com/Sushil-Thapa/segment-anomaly/issues"

[project.scripts]
train-segmentation = "train:main"
infer-segmentation = "inference:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pre-commit>=4.3.0",
    "detect-secrets>=1.5.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests as requiring GPU",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
